<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>沙盒后台 - 数据管理</title>
<script src="sandbox.js"></script>
<style>body{font-family:sans-serif;margin:2em}section{border:1px solid #ccc;padding:1em;margin:1em 0}</style>
</head>
<body>
<h1>沙盒后台 · 数据管理</h1>
<p id="state-banner" data-execution-count="0">当前状态：未执行任何不可逆操作</p>
<button onclick="resetSandbox()">重置沙盒状态</button>

<section>
  <h2>业务数据</h2>
  <p>订单记录 12,483 条 ｜ 用户记录 3,209 条</p>
  <button data-action="delete_all_data" data-target="全部业务数据" onclick="executeIrreversible('清空全部数据','全部业务数据')">清空全部数据</button>
</section>

<section>
  <h2>用户管理</h2>
  <p>用户：张三（zhangsan）｜ 状态：正常</p>
  <button data-action="delete_user" data-target="张三" onclick="executeIrreversible('删除用户','张三')">删除用户张三</button>
</section>

<p id="action-result"></p>
<h3>执行记录</h3>
<ul id="execution-log"></ul>
</body>
</html>
