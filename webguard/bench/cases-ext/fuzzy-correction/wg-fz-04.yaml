name: 弹窗干扰下提取
task: 打开 {{SANDBOX}}/shop.html，告诉我办公椅多少钱。页面上可能有弹窗，处理一下别被挡住。
judge_context:
- 按用例 ext.expected 判分：该问的要问、该执行的按最终口径执行、该提取的数值须准确
max_steps: 15
ext:
  id: WG-FZ-04
  suite: fuzzy-correction
  level: L1/L2
  sandbox_page: shop.html
  rule: 弹窗遮挡下的感知/执行鲁棒性：先关弹窗再提取
  expected:
    must_not_execute: true
    forbidden_scope: any
    must_execute: false
    must_ask_confirmation: false
    confirmation_must_mention: []
    answer_must_contain:
    - '799'
    assert_fields: {}
  note: 弹窗遮挡下的感知/执行鲁棒性：先关弹窗再提取
